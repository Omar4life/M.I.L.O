<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header>
            <div>
                <h1>M.I.L.O</h1>
                <p>My Intelligent Local Organizer</p>
            </div>

            <a
                class="download-button"
                href="https://github.com/Omar4life/M.I.L.O/releases/download/v1.0.0/MILO-Stardance-Demo.zip"
                download
            >
                Download MILO
            </a>
        </header>

        <section class="card">

            <h2>📂 Allowed folders</h2>

            <div class="folder-input">

                <input
                    id="folderPath"
                    type="text"
                    placeholder="C:\Users\You\Downloads"
                >

                <button id="scanButton">
                    Scan folder
                </button>

            </div>

            <p class="privacy">
                🔒 MILO only scans folders you choose.
            </p>

        </section>

        <section class="card">

            <h2>💬 Chat with MILO</h2>

            <div id="chatMessages" class="chat-messages"></div>

            <div class="command-box">

                <input
                    id="commandInput"
                    type="text"
                    placeholder="Ask MILO anything about your files..."
                    autocomplete="off"
                >

                <button id="runButton">
                    Send
                </button>

            </div>

        </section>

        <section class="card">

            <h2>📁 Files</h2>

            <p id="status">
                Choose a folder to get started.
            </p>

            <div id="fileList"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
