<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MILO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="header">

            <div>
                <h1>M.I.L.O</h1>
                <p>My Intelligent Local Organizer</p>
            </div>

        </header>


        <section class="card folder-card">

            <div class="section-title">
                <h2>📂 Allowed folder</h2>
            </div>

            <div class="folder-input">

                <input
                    id="folderPath"
                    type="text"
                    placeholder="C:\Users\You\Downloads"
                >

                <button id="scanButton">
                    Scan
                </button>

            </div>

            <p class="privacy">
                🔒 MILO only scans folders you choose.
            </p>

        </section>


        <section class="chat-card">

            <div class="chat-header">

                <div>
                    <h2>MILO</h2>
                    <p>Ask me anything about your files</p>
                </div>

                <div class="chat-actions">

                    <button
                        id="newChatButton"
                        class="new-chat-button"
                    >
                        + New chat
                    </button>

                    <button
                        id="historyButton"
                        class="history-button"
                    >
                        ☰
                    </button>

                </div>

            </div>


            <div
                id="chatSidebar"
                class="chat-sidebar"
            >

                <div class="sidebar-header">

                    <strong>Previous chats</strong>

                    <button
                        id="closeSidebarButton"
                        class="close-sidebar"
                    >
                        ×
                    </button>

                </div>

                <div
                    id="chatList"
                    class="chat-list"
                ></div>

            </div>


            <div
                id="messages"
                class="messages"
            >

                <div class="welcome">

                    <div class="welcome-icon">
                        M
                    </div>

                    <h3>
                        What can I help you find?
                    </h3>

                    <p>
                        Ask MILO to find or read something from your allowed folder.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion">
                            Find my robotics files
                        </button>

                        <button class="suggestion">
                            Find my Spider-Man ticket
                        </button>

                        <button class="suggestion">
                            Find my AI tools documents
                        </button>

                    </div>

                </div>

            </div>


            <div
                id="status"
                class="status"
            ></div>


            <div class="input-area">

                <div class="command-box">

                    <input
                        id="commandInput"
                        type="text"
                        placeholder="Ask MILO what to do..."
                        autocomplete="off"
                    >

                    <button
                        id="runButton"
                        class="send-button"
                    >
                        ↑
                    </button>

                </div>

                <p class="input-hint">
                    MILO searches only the folder you allow.
                </p>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
